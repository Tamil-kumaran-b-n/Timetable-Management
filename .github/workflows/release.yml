name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name TimetableManagement --distpath dist --add-data "ui/styles/icons;ui/styles/icons" --add-data "manifest.json;." main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimetableManagement-Windows
          path: dist/TimetableManagement.exe

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v1.0.0' }
          $relTitle = if ($env:GITHUB_REF -like 'refs/tags/*') { "Release $env:GITHUB_REF_NAME" } else { 'Smart Timetable Management v1.0.0' }
          $notes = "Automated release of Smart Academic Timetable Management System ($tagName)"
          
          if (gh release view $tagName 2>$null) {
            gh release upload $tagName dist/TimetableManagement.exe --clobber
          } else {
            gh release create $tagName dist/TimetableManagement.exe --title "$relTitle" --notes "$notes" --clobber
          }
