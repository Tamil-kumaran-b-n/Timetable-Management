name: Build & Release Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name TimetableManagement --distpath dist --add-data "ui/styles/icons;ui/styles/icons" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimetableManagement-Windows
          path: dist/TimetableManagement.exe

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Smart Timetable Management v1.0.0' }}
          files: dist/TimetableManagement.exe
          draft: false
          prerelease: false
          generate_release_notes: true
